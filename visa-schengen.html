<script>
(function(){
  var shown=false;
  document.addEventListener('mouseleave',function(e){
    if(e.clientY>15||shown||sessionStorage.getItem('vl_exit'))return;
    shown=true;sessionStorage.setItem('vl_exit','1');
    var o=document.getElementById('exit-overlay');
    if(o){o.style.display='flex';document.body.style.overflow='hidden'}
  });
  var lastY=0;
  window.addEventListener('scroll',function(){
    var y=window.scrollY;
    if(lastY-y>100&&y>300&&!shown&&!sessionStorage.getItem('vl_exit')){
      shown=true;sessionStorage.setItem('vl_exit','1');
      var o=document.getElementById('exit-overlay');
      if(o){o.style.display='flex';document.body.style.overflow='hidden'}
    }
    lastY=y;
  });
})();
function closeExit(){var o=document.getElementById('exit-overlay');if(o){o.style.display='none';document.body.style.overflow=''}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeExit()});
document.getElementById('exit-overlay').addEventListener('click',function(e){if(e.target===this)closeExit()});
</script>
