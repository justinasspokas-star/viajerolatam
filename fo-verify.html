<script id="vl-consent-bootstrap">
window.dataLayer=window.dataLayer||[];
window.gtag=window.gtag||function(){window.dataLayer.push(arguments);};
(function(){
  var analytics='denied';
  var marketing='denied';
  try{
    var raw=localStorage.getItem('vl_cookie_consent_v1');
    if(raw){
      var saved=JSON.parse(raw);
      if(saved&&saved.version===1&&saved.expiresAt>Date.now()){
        analytics=saved.analytics?'granted':'denied';
        marketing=saved.marketing?'granted':'denied';
      }else{
        localStorage.removeItem('vl_cookie_consent_v1');
      }
    }
  }catch(error){}
  gtag('consent','default',{
    analytics_storage:analytics,
    ad_storage:marketing,
    ad_user_data:marketing,
    ad_personalization:marketing,
    wait_for_update:500
  });
})();
</script>

<script id="vl-ga4-affiliate-normalizer">
(function(){
  if (window.vlGa4AffiliateNormalizerInstalled) return;
  window.vlGa4AffiliateNormalizerInstalled = true;

  function getClickId(){
    try {
      var key = 'vl_affiliate_click_id';
      var id = sessionStorage.getItem(key);
      if (!id) {
        id = 'vl_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        sessionStorage.setItem(key, id);
      }
      return id;
    } catch(e) {
      return 'vl_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }
  }

  function cleanPartner(partner){
    return String(partner || '')
      .toLowerCase()
      .replace(/[^a-z0-9_]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  function partnerFromEvent(eventName, params){
    var partner = '';
    if (eventName.indexOf('click_affiliate_') === 0) {
      partner = eventName.replace('click_affiliate_', '');
    }
    if (!partner && params && params.affiliate_partner) partner = params.affiliate_partner;
    return cleanPartner(partner || 'unknown');
  }

  function install(){
    if (typeof window.gtag !== 'function') {
      window.setTimeout(install, 50);
      return;
    }
    if (window.gtag.vlAffiliateNormalized) return;

    var originalGtag = window.gtag;
    function normalizedGtag(){
      var args = Array.prototype.slice.call(arguments);

      if (args[0] === 'event' && typeof args[1] === 'string') {
        var originalEventName = args[1];
        var eventName = originalEventName.toLowerCase();

        if (eventName !== originalEventName) {
          args[1] = eventName;
        }

        if (eventName.indexOf('click_affiliate_') === 0) {
          var params = args[2] && typeof args[2] === 'object' ? args[2] : {};
          var partner = partnerFromEvent(eventName, params);
          var clickId = params.affiliate_click_id || getClickId();

          params.event_category = params.event_category || 'affiliate';
          params.affiliate_partner = partner;
          params.affiliate_click_id = clickId;
          params.page_path = window.location.pathname;
          params.page_location = params.page_location || window.location.href;
          params.outbound_url = params.outbound_url || params.event_label || params.link_url || '';
          params.link_text = params.link_text || '';

          args[2] = params;

          originalGtag.apply(window, args);

          originalGtag('event', 'affiliate_outbound_click', {
            event_category: 'affiliate',
            affiliate_partner: partner,
            affiliate_click_id: clickId,
            source_event: eventName,
            outbound_url: params.outbound_url,
            page_path: window.location.pathname,
            page_location: window.location.href
          });
          return;
        }
      }

      return originalGtag.apply(window, args);
    }

    normalizedGtag.vlAffiliateNormalized = true;
    window.gtag = normalizedGtag;
  }

  install();
})();
</script>
