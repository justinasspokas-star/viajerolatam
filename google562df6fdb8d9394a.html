
<script id="vl-consent-bootstrap">
window.dataLayer=window.dataLayer||[];
window.gtag=window.gtag||function(){window.dataLayer.push(arguments);};
(function(){
  var analytics='denied';
  var marketing='denied';
  try{
    var raw=localStorage.getItem('vl_cookie_consent_v1');
    if(raw){
      var saved=JSON.parse(raw);
      if(saved&&saved.version===1&&saved.expiresAt>Date.now()){
        analytics=saved.analytics?'granted':'denied';
        marketing=saved.marketing?'granted':'denied';
      }else{
        localStorage.removeItem('vl_cookie_consent_v1');
      }
    }
  }catch(error){}
  gtag('consent','default',{
    analytics_storage:analytics,
    ad_storage:marketing,
    ad_user_data:marketing,
    ad_personalization:marketing,
    wait_for_update:500
  });
})();
</script>

<script defer src="/assets/vl-cookie-consent.js"></script>
